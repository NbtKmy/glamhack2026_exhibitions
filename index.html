<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swiss Exhibitions Map</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <h1>Exhibitions in Switzerland</h1>
    <p>Venues and periods of exhibitions recorded in Wikidata, gaps included.</p>
  </header>

  <main class="main">
    <div id="map" class="map" aria-label="Map of exhibition venues"></div>
    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="panel-close" type="button" aria-label="Close panel">×</button>
      <div id="panel-body"></div>
    </aside>
  </main>

  <footer class="bar">
    <section class="years" aria-label="Year range">
      <div class="years-readout">
        <span id="year-from"></span>–<span id="year-to"></span>
        <span id="in-range" class="muted"></span>
      </div>
      <div class="range">
        <input id="slider-from" type="range" aria-label="From year">
        <input id="slider-to" type="range" aria-label="To year">
      </div>
    </section>
    <section class="gaps" aria-label="Data gaps">
      <h2>Data gaps</h2>
      <ul id="gaps"></ul>
    </section>
    <section class="source" aria-label="Data source">
      <p id="source-meta" class="muted"></p>
      <button id="fetch-live" type="button">Fetch latest data</button>
      <p id="fetch-status" class="status" role="status"></p>
    </section>
  </footer>
</body>
</html>
