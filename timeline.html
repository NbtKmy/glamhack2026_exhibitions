<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Swiss Exhibitions Timeline</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/timeline.js"></script>
</head>
<body>
  <header class="top">
    <h1>Exhibitions in Switzerland — timeline</h1>
    <p>Exhibitions recorded per year, counted in every year they were running.
      Where an exhibition is in Wikidata, the Wikidata record is used.</p>
    <a class="top-link" href="index.html">← Map</a>
  </header>

  <main class="main">
    <section class="timeline" aria-label="Exhibitions per year">
      <ul class="legend">
        <li><span class="swatch wikidata"></span>Wikidata</li>
        <li><span class="swatch wikibase"></span>Hackathon Wikibase</li>
      </ul>
      <div id="chart" class="chart"></div>
      <p id="undated" class="muted"></p>
      <p id="wikibase-status" class="muted"></p>
      <p id="load-status" class="status" role="status"></p>
    </section>
    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="panel-close" type="button" aria-label="Close panel">×</button>
      <div id="panel-body"></div>
    </aside>
  </main>
</body>
</html>
